<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>אסף כהן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #16131c; --soft: #6d6878; --line: #e9e6ee; --accent: #d946a6; --bg: #fbfaf8; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink);
    font-family: "Heebo", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 520px; text-align: center; }
  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 500; color: var(--soft);
    padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  h1 { font-size: clamp(34px, 8vw, 52px); font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; margin: 22px 0 14px; }
  p { font-size: 18px; line-height: 1.6; color: var(--soft); text-wrap: balance; }
</style>
</head>
<body>
  <main>
    <span class="tag"><span class="dot"></span>נקסט לבל</span>
    <h1>המרחב של אסף כהן</h1>
    <p>כאן ייבנה הדף הראשון.<br>כל שינוי שאחד מאיתנו שומר עולה לכאן תוך דקה.</p>
  </main>
</body>
</html>
