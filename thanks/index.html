<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>אתה בפנים | אסף כהן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lp.css">
<style>
.ty{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:clamp(56px,10vw,110px) 20px;overflow:hidden;
  background:radial-gradient(90% 55% at 50% -12%,rgba(var(--a1-rgb),.16),transparent 62%),var(--bg)}
.ty__in{position:relative;z-index:1;width:100%;max-width:560px;text-align:center}
.ty__check{display:block;width:74px;height:74px;margin:0 auto 22px}
.ty__check circle{fill:rgba(var(--a2-rgb),.06);stroke:var(--a2);stroke-width:2}
.ty__check path{fill:none;stroke:var(--a2);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:tyDraw .7s .25s var(--ease-out) forwards}
@keyframes tyDraw{to{stroke-dashoffset:0}}
.ty__kicker{color:var(--a2-soft);font-weight:500;font-size:clamp(16px,1.8vw,18px);margin-bottom:6px}
.ty h1{font-size:clamp(54px,12vw,96px);line-height:1.05;padding-bottom:.06em;margin-bottom:16px}
.ty__steps{list-style:none;margin-top:clamp(34px,5vw,46px);text-align:right;border-top:1px solid var(--a2-line)}
.ty__steps li{display:flex;gap:14px;align-items:flex-start;padding:18px 2px;border-bottom:1px solid var(--a2-line);
  font-size:clamp(17px,1.9vw,19px);color:var(--t-mid);line-height:1.5}
.ty__steps b{color:var(--t-hi);font-weight:700}
.ty svg.i{flex:none;width:22px;height:22px;margin-top:2px;fill:none;stroke:var(--a2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ty__help{margin-top:clamp(34px,5vw,44px)}
.ty__help p{color:var(--t-mid);font-weight:300;font-size:clamp(16px,1.8vw,18px);margin-bottom:14px}
.ty__wa{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;text-decoration:none;font-weight:700;font-size:17px;
  color:var(--a2-soft);border:1px solid var(--a2-line);background:rgba(var(--a2-rgb),.06);transition:background .3s,border-color .3s}
.ty__wa:hover{background:rgba(var(--a2-rgb),.12);border-color:rgba(var(--a2-rgb),.5)}
.ty__wa svg.i{margin-top:0;stroke:currentColor}
.ty__sign{margin-top:clamp(46px,7vw,64px);font-weight:900;font-size:clamp(28px,4.6vw,40px);line-height:1.15;
  background:var(--name-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
@media (prefers-reduced-motion:reduce){.ty__check path{animation:none;stroke-dashoffset:0}}
</style>
<!-- Meta Pixel: Spacho Pixel. PageView, then one Purchase per sale -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init','1414882050303278');
fbq('track','PageView');
/* ?preview shows the page without counting a sale. A reload within 12 hours is not a second sale.
   The amount comes from ?value= when the checkout sends it, otherwise the course price, 297. */
(function(){
  var q=new URLSearchParams(location.search),KEY="spacho_purchase_at",now=Date.now(),last=0;
  if(q.has("preview"))return;
  try{last=+localStorage.getItem(KEY)||0;}catch(e){}
  if(now-last<12*36e5)return;
  try{localStorage.setItem(KEY,String(now));}catch(e){}
  fbq('track','Purchase',{value:parseFloat(q.get("value"))||297,currency:'ILS'});
})();
</script>
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=1414882050303278&ev=PageView&noscript=1"></noscript>
</head>
<body>
<main class="ty bg-grid">
  <div class="ty__in">
    <svg class="ty__check" viewBox="0 0 74 74" aria-hidden="true"><circle cx="37" cy="37" r="35"/><path d="M23 38.5l9.5 9.5L52 28"/></svg>
    <p class="ty__kicker">התשלום עבר 🎧</p>
    <h1 class="gt-a1">אתה בפנים.</h1>
    <p class="sub">תוך 60 שניות מגיע אליך מייל עם הגישה.</p>

    <ul class="ty__steps">
      <li><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg><span><b>תיכנס למייל</b> שכתבת בטופס.</span></li>
      <li><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span><b>לא מוצא?</b> תבדוק בספאם ובקידומי מכירות.</span></li>
      <li><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg><span><b>מצאת?</b> תשמור אותו, כל הגישה שלך שם.</span></li>
    </ul>

    <div class="ty__help">
      <p>לא הגיע תוך כמה דקות?</p>
      <a class="ty__wa" href="https://wa.me/972503344778?text=%D7%94%D7%99%D7%99%2C%20%D7%A7%D7%A0%D7%99%D7%AA%D7%99%20%D7%95%D7%A2%D7%95%D7%93%20%D7%9C%D7%90%20%D7%A7%D7%99%D7%91%D7%9C%D7%AA%D7%99%20%D7%90%D7%AA%20%D7%94%D7%9E%D7%99%D7%99%D7%9C" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5l1.2-3.6A8 8 0 1112 20a8 8 0 01-3.9-1z"/></svg>תכתוב לי בוואטסאפ</a>
    </div>

    <p class="ty__sign">נתראה ברחבה.</p>
  </div>
</main>
</body>
</html>
