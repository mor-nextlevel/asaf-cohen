<style>
.ty{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:clamp(40px,7vw,80px) 20px clamp(56px,9vw,96px);overflow:hidden;
  background:radial-gradient(90% 55% at 50% -12%,rgba(var(--a1-rgb),.16),transparent 62%),var(--bg)}
.ty__in{position:relative;z-index:1;width:100%;max-width:640px;text-align:center}
.ty__name{font-weight:900;font-size:clamp(58px,16vw,116px);line-height:.95;letter-spacing:-.02em;direction:ltr;padding:.04em .1em;
  background:var(--name-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 34px rgba(var(--a1-rgb),.3))}
.ty__mock{position:relative;max-width:600px;margin:clamp(14px,2.6vw,26px) auto 0}
.ty__mock::before{content:"";position:absolute;left:8%;right:8%;bottom:-2%;height:30%;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--a1-rgb),.4),transparent);filter:blur(26px)}
.ty__mock img{position:relative;width:100%;filter:drop-shadow(0 22px 36px rgba(0,0,0,.6));animation:float 8s ease-in-out infinite}
.ty__ok{display:inline-flex;align-items:center;gap:8px;margin-top:clamp(30px,5vw,44px);padding:7px 16px;border-radius:999px;
  color:var(--a2-soft);font-weight:500;font-size:clamp(15px,1.7vw,17px);border:1px solid var(--a2-line);background:rgba(var(--a2-rgb),.06)}
.ty__ok svg{width:18px;height:18px;fill:none;stroke:var(--a2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ty__ok path{stroke-dasharray:24;stroke-dashoffset:24;animation:tyDraw .6s .3s var(--ease-out) forwards}
@keyframes tyDraw{to{stroke-dashoffset:0}}
.ty h1{font-size:clamp(46px,11vw,80px);line-height:1.05;padding-bottom:.06em;margin:12px 0 12px}
.ty__steps{list-style:none;margin-top:clamp(30px,5vw,42px);text-align:right;border-top:1px solid var(--a2-line)}
.ty__steps li{display:flex;gap:14px;align-items:flex-start;padding:18px 2px;border-bottom:1px solid var(--a2-line);
  font-size:clamp(17px,1.9vw,19px);color:var(--t-mid);line-height:1.5}
.ty__steps b{color:var(--t-hi);font-weight:700}
.ty__steps em{font-style:normal;font-weight:700;color:var(--a1-soft)}
.ty svg.i{flex:none;width:22px;height:22px;margin-top:2px;fill:none;stroke:var(--a2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ty__steps li.hot svg.i{stroke:var(--a1)}
.ty__links{display:grid;justify-items:center;margin-top:clamp(36px,5vw,48px)}
.ty__q{color:var(--t-mid);font-weight:300;font-size:clamp(16px,1.8vw,18px);margin:26px 0 12px}
.ty__btn{display:flex;align-items:center;justify-content:center;gap:12px;width:min(100%,340px);min-height:60px;padding:10px 22px;border-radius:999px;
  text-decoration:none;color:var(--t-hi);font-weight:700;font-size:17px;
  background:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(var(--ivory-rgb),.14);
  transition:border-color .3s,box-shadow .3s,transform .3s var(--ease-out)}
.ty__btn svg{flex:none;width:32px;height:32px}
.ty__btn:hover{transform:translateY(-2px)}
.ty__btn--ig:hover{border-color:rgba(214,36,159,.6);box-shadow:0 10px 34px -12px rgba(214,36,159,.55)}
.ty__btn--wa{border-color:rgba(37,211,102,.32)}
.ty__btn--wa:hover{border-color:rgba(37,211,102,.7);box-shadow:0 10px 34px -12px rgba(37,211,102,.55)}
@media (prefers-reduced-motion:reduce){.ty__mock img{animation:none}.ty__ok path{animation:none;stroke-dashoffset:0}.ty__btn:hover{transform:none}}
</style>

fbq('init','1414882050303278');
fbq('track','PageView');
/* ?preview shows the page without counting a sale. A reload within 12 hours is not a second sale.
   The amount comes from ?value= when the checkout sends it, otherwise the course price, 297. */
(function(){
  var q=new URLSearchParams(location.search),KEY="spacho_purchase_at",now=Date.now(),last=0;
  if(q.has("preview"))return;
  try{last=+localStorage.getItem(KEY)||0;}catch(e){}
  if(now-last<12*36e5)return;
  try{localStorage.setItem(KEY,String(now));}catch(e){}
  fbq('track','Purchase',{value:parseFloat(q.get("value"))||297,currency:'ILS'});
})();
</script>
